name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python surfaces
        run: python -m compileall -q src modules tests scripts FORENSIC_PLANTABLE SUPERMEMORY_UNIFIED_ORCHESTRATOR
      - name: Run Python behavior tests
        env:
          PYTHONPATH: .:src
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Enforce public truth boundary
        run: python scripts/verify_public_truth.py

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run TypeScript tests
        run: npm test -- --runInBand
      - name: Build TypeScript server
        run: npm run build
