name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Compile Python surfaces
        run: python -m compileall -q src modules tests FORENSIC_PLANTABLE SUPERMEMORY_UNIFIED_ORCHESTRATOR
      - name: Run Python behavior tests
        env:
          PYTHONPATH: .:src
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  node:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run TypeScript tests
        run: npm test -- --runInBand
      - name: Build TypeScript server
        run: npm run build
